name: Audit source-book chapter and language boundaries

on:
  push:
    paths:
      - '.github/workflows/source-book-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research archive
        uses: actions/checkout@v4

      - name: Install PDF text tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Download the four authoritative source volumes
        run: |
          mkdir -p .source-books reports/source-book-diagnostics
          base='https://raw.githubusercontent.com/videha-ejournal/videha-ejournal/main'
          curl -L --fail --retry 3 "$base/HISTORY_MITHILA_ANGA_VAJJI.pdf" -o .source-books/history-v1.pdf
          curl -L --fail --retry 3 "$base/History_Mithila_Vajji_Anga_Volume_II_merge.pdf" -o .source-books/history-v2.pdf
          curl -L --fail --retry 3 "$base/GAJENDRA_THAKUR_PARALLEL_PHILOSOPHY.pdf" -o .source-books/philosophy-v1.pdf
          curl -L --fail --retry 3 "$base/Samanantar_Darshan_Volume_II_merge.pdf" -o .source-books/philosophy-v2.pdf

      - name: Extract searchable text and diagnostics
        run: |
          for stem in history-v1 history-v2 philosophy-v1 philosophy-v2; do
            pdfinfo ".source-books/$stem.pdf" > "reports/source-book-diagnostics/$stem-pdfinfo.txt"
            pdftotext -layout ".source-books/$stem.pdf" "reports/source-book-diagnostics/$stem.txt"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('reports/source-book-diagnostics')
          patterns = [
              re.compile(r'(?i)\bchapter\s*[-–—:. ]*\d{1,3}\b'),
              re.compile(r'अध्याय\s*[-–—:. ]*[०-९0-9]{1,3}'),
              re.compile(r'अध्\s*याय\s*[-–—:. ]*[०-९0-9]{1,3}'),
              re.compile(r'(?i)\bvolume\s+[ivx0-9]+\b'),
              re.compile(r'(?i)\bpart\s+[ivx0-9]+\b'),
          ]
          deva = re.compile(r'[\u0900-\u097f]')
          latin = re.compile(r'[A-Za-z]')

          out = []
          for stem in ('history-v1','history-v2','philosophy-v1','philosophy-v2'):
              text_path = root / f'{stem}.txt'
              text = text_path.read_text('utf-8', errors='replace')
              lines = text.splitlines()
              out.append(f'===== {stem} =====')
              out.append((root / f'{stem}-pdfinfo.txt').read_text('utf-8', errors='replace'))
              out.append('--- first 220 nonblank lines ---')
              nonblank = [ln for ln in lines if ln.strip()]
              out.extend(nonblank[:220])
              out.append('--- heading candidates with line numbers ---')
              hits = []
              for i, line in enumerate(lines, 1):
                  s = line.strip()
                  if not s:
                      continue
                  if any(p.search(s) for p in patterns):
                      hits.append((i, s))
              for i, s in hits[:1800]:
                  out.append(f'{i}: {s}')
              out.append(f'heading-candidate-count: {len(hits)}')
              out.append(f'devanagari-lines: {sum(bool(deva.search(x)) for x in lines)}')
              out.append(f'latin-lines: {sum(bool(latin.search(x)) for x in lines)}')
              out.append('')
          (root / 'diagnostics.txt').write_text('\n'.join(out), 'utf-8')
          PY

      - name: Verify expected source PDFs and text extraction
        run: |
          test -s reports/source-book-diagnostics/history-v1.txt
          test -s reports/source-book-diagnostics/history-v2.txt
          test -s reports/source-book-diagnostics/philosophy-v1.txt
          test -s reports/source-book-diagnostics/philosophy-v2.txt
          grep -q 'Pages:' reports/source-book-diagnostics/history-v1-pdfinfo.txt
          grep -q 'Pages:' reports/source-book-diagnostics/philosophy-v1-pdfinfo.txt

      - name: Upload source diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: source-book-diagnostics
          path: reports/source-book-diagnostics/
          if-no-files-found: error
          retention-days: 7
