name: Deploy Mithila–Vajji–Anga to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install production image optimizer
        run: npm install --no-save --package-lock=false sharp@0.35.4
      - name: Lint source
        run: npm run lint
      - name: Build static site, scholarly export and performance layer
        env:
          REQUIRE_IMAGE_OPTIMIZATION: '1'
          REQUIRE_EXTERNAL_SOURCE_LIBRARY: '1'
          GITHUB_API_TOKEN: ${{ github.token }}
        run: npm run build
      - name: Verify scholarly export, archive identity, history pages, bilingual collections, source library and performance contract
        run: |
          test -f dist/client/records/index.html
          test -f dist/client/records-index.json
          test -f dist/client/about/index.html
          test -f dist/client/history/index.html
          test -f dist/client/chapters/political-1/index.html
          test -f dist/client/chapters/political-28/index.html
          test -f dist/client/chapters/social-1/index.html
          test -f dist/client/chapters/social-150/index.html
          test "$(find dist/client/chapters -mindepth 2 -maxdepth 2 -type f -name index.html | wc -l | tr -d ' ')" -eq 178
          test -f dist/client/philosophy/index.html
          test -f dist/client/literature/index.html
          test -f dist/client/panji/index.html
          test -f dist/client/en/index.html
          test -f dist/client/en/philosophy/index.html
          test -f dist/client/en/literature/index.html
          test -f dist/client/en/panji/index.html
          test -f dist/client/source-library/index.html
          test -f dist/client/source-library/catalog.json
          test -f dist/client/source-library/SHA256SUMS.txt
          test -f dist/client/source-library/GIT-BLOB-IDS.txt
          test -f dist/client/data/releases/2026.09/records.json
          test -f dist/client/data/releases/2026.09/SHA256SUMS.txt
          test -f dist/client/data/scholarly-export-report.json
          test -f dist/client/data/performance-report.json
          test -f dist/client/data/image-optimization-report.json
          test -f dist/client/data/release-integrity-report.json
          test -f dist/client/accessibility/AUDIT.md
          test -f dist/client/sitemap.xml
          test -f dist/client/robots.txt
          test -f dist/client/manifest.webmanifest
          grep -q "Videha Digital Research Archive" dist/client/index.html
          grep -q "Digital Humanities Research Environment for Mithila, Vajji" dist/client/index.html
          grep -q "Videha Digital Research Archive" dist/client/about/index.html
          grep -q "Videha Digital Research Archive" dist/client/records/index.html
          grep -q "Two histories, one connected regional archive" dist/client/history/index.html
          grep -q "Detailed chapter description" dist/client/chapters/political-1/index.html
          grep -q "Detailed chapter description" dist/client/chapters/social-150/index.html
          grep -q "द्विभाषी संरचना" dist/client/philosophy/index.html
          grep -q "द्विभाषी संरचना" dist/client/literature/index.html
          grep -q "द्विभाषी संरचना" dist/client/panji/index.html
          grep -q "Bilingual architecture" dist/client/en/philosophy/index.html
          grep -q "Bilingual architecture" dist/client/en/literature/index.html
          grep -q "Bilingual architecture" dist/client/en/panji/index.html
          grep -q "source-library/" dist/client/sitemap.xml
          grep -q "chapters/political-1/" dist/client/sitemap.xml
          grep -q "chapters/social-150/" dist/client/sitemap.xml
          grep -q "philosophy/" dist/client/sitemap.xml
          grep -q "literature/" dist/client/sitemap.xml
          grep -q "panji/" dist/client/sitemap.xml
          grep -q "en/philosophy/" dist/client/sitemap.xml
          grep -q "en/literature/" dist/client/sitemap.xml
          grep -q "en/panji/" dist/client/sitemap.xml
          node scripts/verify-release-integrity.mjs
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const r=JSON.parse(readFileSync('./dist/client/data/scholarly-export-report.json','utf8')); if(!r.checks.uniqueRecordKeys||!r.checks.allRecordsHaveTitle||!r.checks.allRecordsHaveUrl||!r.checks.allRecordsHaveCitation) process.exit(1); console.log(r)"
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const r=JSON.parse(readFileSync('./dist/client/data/performance-report.json','utf8')); if(Object.values(r.checks).some(v => !v)) process.exit(1); console.log(r)"
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const r=JSON.parse(readFileSync('./dist/client/source-library/catalog.json','utf8')); const s=r.sourceRepositories?.[0]; if(r.name!=='Videha Digital Research Archive · Source PDF Library'||!Array.isArray(r.books)||r.externalCount<1||!s||s.repository!=='videha-ejournal/videha-ejournal'||!s.sourceCommit||r.books.some(b=>b.sourceType==='external-github'&&(!b.sourceCommit||!b.gitBlobSha||!b.githubUrl))) process.exit(1); console.log({sourcePdfCount:r.count,externalPdfCount:r.externalCount,sourceCommit:s.sourceCommit})"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  live-smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify live GitHub Pages release
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://videha-ejournal.github.io/mithila-vajji-anga"
          fetch() {
            curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors "$1"
          }
          wait_for_marker() {
            local target="$1"
            local marker="$2"
            local body=""
            for attempt in {1..12}; do
              body="$(fetch "$target")"
              if grep -Fq "$marker" <<<"$body"; then
                printf '%s' "$body"
                return 0
              fi
              sleep 5
            done
            echo "Live page did not expose expected marker: $target :: $marker" >&2
            return 1
          }

          ROOT="$(wait_for_marker "$BASE/" '<html lang="mai"')"
          EN="$(wait_for_marker "$BASE/en/" 'hreflang="x-default"')"
          grep -Fq 'Videha Digital Research Archive | Digital Humanities Research Environment for Mithila, Vajji' <<<"$ROOT"
          grep -Fq 'Videha Digital Research Archive | Digital Humanities Research Environment for Mithila, Vajji' <<<"$EN"
          grep -Fq 'hreflang="en"' <<<"$ROOT"
          grep -Fq 'hreflang="mai"' <<<"$EN"
          grep -Fq '178 permanent History chapters' <<<"$ROOT"
          grep -Fq '178 permanent History chapters' <<<"$EN"
          if grep -Fq 'Chapters 1–86' <<<"$ROOT$EN"; then
            echo 'Stale History completion text is still live' >&2
            exit 1
          fi

          for route in "/history/" "/philosophy/" "/literature/" "/panji/" "/en/philosophy/" "/en/literature/" "/en/panji/" "/en/sources/" "/en/updates/" "/chapters/political-1/" "/chapters/social-150/" "/favicon.svg" "/sitemap.xml" "/robots.txt"; do
            fetch "$BASE$route" >/dev/null
          done

          SITEMAP="$(fetch "$BASE/sitemap.xml")"
          grep -Fq 'xmlns:xhtml="http://www.w3.org/1999/xhtml"' <<<"$SITEMAP"
          grep -Fq '<lastmod>2026-09-14</lastmod>' <<<"$SITEMAP"
          grep -Fq 'hreflang="mai"' <<<"$SITEMAP"
          grep -Fq 'hreflang="en"' <<<"$SITEMAP"

          CSS_HREF="$(grep -oEm1 'href="[^"]+\.css"' <<<"$ROOT" | cut -d '"' -f 2)"
          test -n "$CSS_HREF"
          case "$CSS_HREF" in
            http*) CSS_URL="$CSS_HREF" ;;
            /*) CSS_URL="https://videha-ejournal.github.io$CSS_HREF" ;;
            *) CSS_URL="$BASE/$CSS_HREF" ;;
          esac
          fetch "$CSS_URL" >/dev/null
          echo "Live release smoke test passed for $BASE"
