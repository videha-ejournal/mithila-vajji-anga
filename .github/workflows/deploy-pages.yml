name: Deploy Mithila–Vajji–Anga to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install production image optimizer
        run: npm install --no-save --package-lock=false sharp@0.35.4
      - name: Lint source
        run: npm run lint
      - name: Build static site, scholarly export and performance layer
        env:
          REQUIRE_IMAGE_OPTIMIZATION: '1'
        run: npm run build
      - name: Verify scholarly export, archive identity and performance contract
        run: |
          test -f dist/client/records/index.html
          test -f dist/client/records-index.json
          test -f dist/client/about/index.html
          test -f dist/client/source-library/index.html
          test -f dist/client/source-library/catalog.json
          test -f dist/client/source-library/SHA256SUMS.txt
          test -f dist/client/data/releases/2026.09/records.json
          test -f dist/client/data/releases/2026.09/SHA256SUMS.txt
          test -f dist/client/data/scholarly-export-report.json
          test -f dist/client/data/performance-report.json
          test -f dist/client/data/image-optimization-report.json
          test -f dist/client/sitemap.xml
          test -f dist/client/robots.txt
          test -f dist/client/manifest.webmanifest
          grep -q "Videha Digital Research Archive" dist/client/index.html
          grep -q "Digital Humanities Research Environment for Mithila, Vajji" dist/client/index.html
          grep -q "Videha Digital Research Archive" dist/client/about/index.html
          grep -q "Videha Digital Research Archive" dist/client/records/index.html
          grep -q "source-library/" dist/client/sitemap.xml
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const r=JSON.parse(readFileSync('./dist/client/data/scholarly-export-report.json','utf8')); if(!r.checks.uniqueRecordKeys||!r.checks.allRecordsHaveTitle||!r.checks.allRecordsHaveUrl||!r.checks.allRecordsHaveCitation) process.exit(1); console.log(r)"
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const r=JSON.parse(readFileSync('./dist/client/data/performance-report.json','utf8')); if(Object.values(r.checks).some(v => !v)) process.exit(1); console.log(r)"
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const r=JSON.parse(readFileSync('./dist/client/source-library/catalog.json','utf8')); if(r.name!=='Videha Digital Research Archive · Source PDF Library'||!Array.isArray(r.books)) process.exit(1); console.log({sourcePdfCount:r.count})"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
