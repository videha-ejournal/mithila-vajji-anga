name: Diagnose second Decoding Panji strict-build failure

on:
  push:
    branches: [chatgpt/decoding-panji-i-vi]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Inspect Volume II page 5
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          node scripts/prepare-panji-article-corpus.mjs > /dev/null 2>&1
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('.source-books/DECODING_PANJI_2.chapter-layout.txt')
          pages=[x.splitlines() for x in p.read_text('utf-8', errors='replace').split('\f')]
          rx=re.compile(r'^\s*Chapter\s+(\d+)\b(?:\s*[.:\-–—]\s*(.*))?\s*$', re.I)
          lines=pages[4]
          print('===== PAGE 5 FULL =====')
          for i,line in enumerate(lines):
              flag=' <CHAPTER_MATCH>' if rx.match(line) else ''
              print(f'{i:03d}: {line}{flag}')
          PY
          exit 1
