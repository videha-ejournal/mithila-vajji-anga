name: Apply Decoding Panji boundary fix

on:
  push:
    branches: [chatgpt/decoding-panji-i-vi]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/decoding-panji-i-vi
      - name: Tighten chapter-heading detection and clean diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/run-panji-article-corpus.py')
          text = p.read_text('utf-8')
          old = "CHAPTER_RE = re.compile(r'^\\s*Chapter\\s+(\\d+)\\b\\s*(?:[.:\\-–—]\\s*)?(.*)$', re.I)"
          new = "# Match only a bare chapter heading or a punctuation-delimited title; reject prose such as ‘Chapter 16 will…’.\nCHAPTER_RE = re.compile(r'^\\s*Chapter\\s+(\\d+)\\b(?:\\s*[.:\\-–—]\\s*(.*))?\\s*$', re.I)"
          if old not in text:
              raise SystemExit('Expected CHAPTER_RE definition not found; refusing blind edit')
          p.write_text(text.replace(old, new, 1), 'utf-8')
          PY
          rm -f .github/workflows/diagnose-panji-boundaries.yml .github/workflows/apply-panji-boundary-fix.yml
          git config user.name videha-ejournal
          git config user.email ggajendra@gmail.com
          git add scripts/run-panji-article-corpus.py .github/workflows
          git diff --cached --check
          git commit -m "Fix Decoding Panji chapter boundary detection"
          git push origin HEAD:chatgpt/decoding-panji-i-vi
