name: Validate Decoding Panji strict production build

on:
  push:
    branches: [chatgpt/decoding-panji-i-vi]
    paths-ignore:
      - '.diagnostics/**'

permissions:
  contents: write

env:
  CI: '1'

jobs:
  strict-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/decoding-panji-i-vi
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install production image optimizer
        run: npm install --no-save --package-lock=false sharp@0.35.4

      - name: Run complete strict production build and capture diagnostics
        id: strict_build
        shell: bash
        env:
          REQUIRE_IMAGE_OPTIMIZATION: '1'
          REQUIRE_EXTERNAL_SOURCE_LIBRARY: '1'
          GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .diagnostics
          set +e
          npm run build > .diagnostics/panji-strict-build.log 2>&1
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          tail -n 300 .diagnostics/panji-strict-build.log
          exit 0

      - name: Persist strict-build failure log
        if: steps.strict_build.outputs.exit_code != '0'
        shell: bash
        run: |
          printf 'Strict build exit code: %s\nCommit tested: %s\n' '${{ steps.strict_build.outputs.exit_code }}' "$(git rev-parse HEAD)" > .diagnostics/panji-strict-build-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .diagnostics/panji-strict-build.log .diagnostics/panji-strict-build-status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'diagnostics: capture next Panji strict-build failure'
            git push origin HEAD:chatgpt/decoding-panji-i-vi
          fi
          exit 1

      - name: Clean diagnostics after green strict build
        if: steps.strict_build.outputs.exit_code == '0'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .diagnostics
          rm -f .github/workflows/diagnose-panji-build.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove temporary Panji diagnostics after green build'
            git push origin HEAD:chatgpt/decoding-panji-i-vi
          fi
