name: Diagnose Decoding Panji Chapter 35

on:
  push:
    branches: [chatgpt/decoding-panji-i-vi]
    paths-ignore:
      - '.diagnostics/**'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/decoding-panji-i-vi
      - name: Install Poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Inspect selected Chapter 35 start in Volumes II, IV and V
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_SHA=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/videha-ejournal/videha-ejournal/branches/main | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')
          mkdir -p .source-books .diagnostics
          for V in 2 4 5; do
            curl -fL --retry 3 -o ".source-books/DECODING_PANJI_${V}.pdf" "https://raw.githubusercontent.com/videha-ejournal/videha-ejournal/${SOURCE_SHA}/DECODING_PANJI_${V}.pdf"
          done
          python3 - <<'PY' > .diagnostics/ch35-parser-selection.txt
          import importlib.util
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('panji','scripts/run-panji-article-corpus.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          for volume in (2,4,5):
              pdf=Path('.source-books')/f'DECODING_PANJI_{volume}.pdf'
              pages=mod.run_pdftotext(pdf)
              rows=mod.flatten(pages)
              starts=mod.select_body_starts(rows, mod.EXPECTED[volume])
              start=starts[34]
              row=rows[start]
              match=mod.CHAPTER_RE.match(row['text'])
              print(f'=== VOLUME {volume} CHAPTER 35 ===')
              print('selected_index=',start,'page=',row['page'],'line=',row['line'])
              print('selected_text=',repr(row['text']))
              print('regex_groups=',match.groups() if match else None)
              try:
                  print('extract_title=',repr(mod.extract_title(rows,start,35)))
              except Exception as exc:
                  print('extract_title_ERROR=',repr(exc))
              print('context:')
              for j in range(max(0,start-8),min(len(rows),start+18)):
                  print(f"{j:06d} p{rows[j]['page']:04d} l{rows[j]['line']:03d}: {rows[j]['text']}")
              print()
          PY
      - name: Commit diagnostic context
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .diagnostics/ch35-parser-selection.txt
          git commit -m 'ci: capture Chapter 35 parser selections' || exit 0
          git push origin HEAD:chatgpt/decoding-panji-i-vi
