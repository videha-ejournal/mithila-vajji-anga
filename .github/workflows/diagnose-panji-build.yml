name: Diagnose Decoding Panji chapter 2-09

on:
  push:
    branches: [chatgpt/decoding-panji-i-vi]
    paths-ignore:
      - '.diagnostics/**'

permissions:
  contents: write

env:
  CI: '1'

jobs:
  diagnose-chapter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/decoding-panji-i-vi
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Generate only Decoding Panji corpus
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
        run: node scripts/prepare-panji-article-corpus.mjs

      - name: Inspect Volume II Chapter 9 placeholder trigger
        shell: bash
        run: |
          mkdir -p .diagnostics
          python3 - <<'PY'
          from pathlib import Path
          import html, re
          p = Path('public/research-articles/decoding-panji/volume-2/chapter-09/index.html')
          text = p.read_text('utf-8')
          pattern = re.compile(r'\b(?:TODO|TBD|LOREM IPSUM|PLACEHOLDER)\b', re.I)
          matches = list(pattern.finditer(text))
          out = []
          out.append(f'file={p}')
          out.append(f'bytes={p.stat().st_size}')
          out.append(f'has_closing_html={"</html>" in text}')
          out.append(f'match_count={len(matches)}')
          for i,m in enumerate(matches,1):
              lo=max(0,m.start()-240); hi=min(len(text),m.end()+240)
              context=html.unescape(text[lo:hi]).replace('\n',' ')
              out.append(f'MATCH {i}: token={m.group(0)!r} offset={m.start()} context={context!r}')
          Path('.diagnostics/chapter-v2-ch09-placeholder.txt').write_text('\n'.join(out)+'\n','utf-8')
          print('\n'.join(out))
          if not matches and '</html>' in text:
              raise SystemExit('Expected current verifier trigger was not reproduced')
          PY

      - name: Persist targeted diagnostic
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .diagnostics/chapter-v2-ch09-placeholder.txt
          if ! git diff --cached --quiet; then
            git commit -m 'diagnostics: identify Panji v2 ch09 placeholder trigger'
            git push origin HEAD:chatgpt/decoding-panji-i-vi
          fi
