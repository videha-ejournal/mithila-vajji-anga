name: Diagnose Decoding Panji strict production phases

on:
  push:
    branches: [chatgpt/decoding-panji-i-vi]
    paths-ignore:
      - '.diagnostics/**'

permissions:
  contents: read

concurrency:
  group: diagnose-panji-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  REQUIRE_IMAGE_OPTIMIZATION: '1'
  REQUIRE_EXTERNAL_SOURCE_LIBRARY: '1'

jobs:
  segmented-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/decoding-panji-i-vi
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      - name: Install production image optimizer
        timeout-minutes: 3
        run: npm install --no-save --package-lock=false sharp@0.35.4

      - name: Phase 1 — source and runtime preparation
        timeout-minutes: 8
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          node scripts/validate-isbn-authority.mjs
          node scripts/export-isbn-authority.mjs
          node scripts/validate-classical-philosophy-inventory.mjs
          node scripts/audit-parallel-philosophy-source.mjs --strict --write-inventory
          node scripts/audit-panji-source.mjs --strict --write-inventory
          node scripts/build-bilingual-detail-inventory.mjs
          node scripts/prepare-runtime-data.mjs
          node scripts/optimize-home-runtime.mjs

      - name: Phase 2 — core research article corpus
        timeout-minutes: 8
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          node scripts/prepare-research-article-corpus.mjs
          node scripts/verify-research-article-corpus.mjs

      - name: Phase 3 — Decoding Panji corpus and duplicate control
        timeout-minutes: 8
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          node scripts/prepare-panji-article-corpus.mjs
          node scripts/verify-panji-article-corpus.mjs
          node scripts/verify-panji-duplicate-control.mjs

      - name: Phase 4 — optimized production compile
        timeout-minutes: 10
        shell: bash
        run: |
          set -euxo pipefail
          node scripts/build-optimized.mjs

      - name: Phase 5 — dist transforms and corpus verification
        timeout-minutes: 6
        shell: bash
        run: |
          set -euxo pipefail
          node scripts/finalize-bilingual-semantics.mjs
          node scripts/verify-bilingual-semantics.mjs
          node scripts/inject-panji-home-directory.mjs
          node scripts/preserve-route-sitemap.mjs
          node scripts/preserve-research-article-sitemap.mjs
          node scripts/verify-research-article-corpus.mjs --dist
          node scripts/verify-panji-article-corpus.mjs --dist

      - name: Phase 6 — release, accessibility, identity and preservation checks
        timeout-minutes: 6
        shell: bash
        run: |
          set -euxo pipefail
          node scripts/finalize-service-worker.mjs
          node scripts/finalize-release-integrity.mjs
          node scripts/finalize-videha-identity.mjs
          node scripts/finalize-panji-book-metadata.mjs
          node scripts/finalize-scholarly-preservation.mjs
          node scripts/verify-release-integrity.mjs
          node scripts/verify-accessibility-engineering.mjs
          node scripts/verify-human-accessibility-qa.mjs
          node scripts/verify-videha-identity.mjs
          node scripts/verify-panji-article-corpus.mjs --dist
          node scripts/verify-scholarly-preservation.mjs

      - name: Segmented strict build passed
        run: echo 'All strict production phases passed.'
