name: Diagnose Decoding Panji boundaries

on:
  push:
    branches: [chatgpt/decoding-panji-i-vi]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PDF tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Inspect Volume II Chapter 16/17 heading occurrences
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 -o /tmp/panji2.pdf https://raw.githubusercontent.com/videha-ejournal/videha-ejournal/main/DECODING_PANJI_2.pdf
          pdftotext -layout /tmp/panji2.pdf /tmp/panji2.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          raw = Path('/tmp/panji2.txt').read_text('utf-8', errors='replace')
          pages = [p.splitlines() for p in raw.split('\f')]
          pat = re.compile(r'^\s*Chapter\s+(16|17)\b\s*(?:[.:\-–—]\s*)?(.*)$', re.I)
          for page_no, lines in enumerate(pages, 1):
              for line_no, line in enumerate(lines):
                  m = pat.match(line)
                  if not m:
                      continue
                  print(f'=== Chapter {m.group(1)} occurrence: PDF page {page_no}, line {line_no} ===')
                  for j in range(max(0, line_no-3), min(len(lines), line_no+12)):
                      print(f'{j:03d}: {lines[j]}')
          PY
