name: Validate Decoding Panji corpus directly

on:
  push:
    branches: [chatgpt/decoding-panji-i-vi]
    paths-ignore:
      - '.diagnostics/**'

permissions:
  contents: write

env:
  CI: '1'

jobs:
  panji-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/decoding-panji-i-vi
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        timeout-minutes: 4
        run: npm ci
      - name: Generate and verify all 247 Panji chapters
        timeout-minutes: 7
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          node scripts/prepare-panji-article-corpus.mjs
          node scripts/verify-panji-article-corpus.mjs
      - name: Audit exact counts and minimum body sizes
        id: substantive_audit
        shell: bash
        run: |
          mkdir -p .diagnostics
          python3 - <<'PY'
          import json, pathlib, re, html
          inv=json.loads(pathlib.Path('app/generated/panji-article-inventory.json').read_text())
          if len(inv) != 247:
              raise SystemExit(f'Expected 247 inventory rows, found {len(inv)}')
          counts={}
          short=[]
          rows=[]
          for r in inv:
              counts[r['volume']]=counts.get(r['volume'],0)+1
              p=pathlib.Path('public')/r['route']/'index.html'
              s=p.read_text('utf-8')
              m=re.search(r'<pre>([\s\S]*?)</pre>',s)
              if not m:
                  short.append((r['volume'],r['chapter'],r['title'],0,0,'missing-pre'))
                  continue
              body=html.unescape(m.group(1))
              words=re.findall(r"\b[\w’'-]+\b", body, flags=re.UNICODE)
              chars=len(re.sub(r'\s+',' ',body).strip())
              if len(words)<500 or chars<3500:
                  short.append((r['volume'],r['chapter'],r['title'],len(words),chars,'short'))
          rows.append('Decoding Panji substantive audit')
          rows.append(f'total={len(inv)}')
          rows.append('counts='+json.dumps(counts,sort_keys=True))
          rows.append(f'short_count={len(short)}')
          rows.append('threshold=words>=500 AND relevant_chars>=3500')
          rows.append('')
          for volume,chapter,title,words,chars,reason in short:
              rows.append(f'V{volume}\tCH{chapter:03d}\twords={words}\tchars={chars}\treason={reason}\t{title}')
          pathlib.Path('.diagnostics/panji-short-chapters.txt').write_text('\n'.join(rows)+'\n','utf-8')
          print('\n'.join(rows))
          pathlib.Path('.diagnostics/panji-short-count.txt').write_text(str(len(short))+'\n','utf-8')
          PY

      - name: Persist substantive audit diagnostic
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .diagnostics/panji-short-chapters.txt .diagnostics/panji-short-count.txt
          if ! git diff --cached --quiet; then
            git commit -m 'diagnostics: persist Panji substantive audit failures'
            git push origin HEAD:chatgpt/decoding-panji-i-vi
          fi

      - name: Enforce substantive threshold
        shell: bash
        run: |
          count="$(tr -d '[:space:]' < .diagnostics/panji-short-count.txt)"
          if [ "$count" != "0" ]; then
            echo "$count chapter(s) fail the substantive threshold."
            cat .diagnostics/panji-short-chapters.txt
            exit 1
          fi
          echo 'All 247 chapters pass the substantive threshold.'
